AWSTemplateFormatVersion: '2010-09-09'
Description: A bucket succeeds and a dependent bucket policy is rejected by S3.
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub 'iacbench-fail-cfn-${AWS::AccountId}-${AWS::Region}'
  DeliberatelyBrokenPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: 'arn:aws:s3:::iacbench-deliberately-wrong-resource/*'
